version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: desen
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: desen
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: desen
    groups:
      actions:
        patterns: ["*"]
