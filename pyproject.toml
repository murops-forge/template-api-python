[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term --cov-report=xml"
